<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AGV 路径图标：一条带节点的路径线 -->
  <path d="M4 20 L8 16 L12 12 L16 8 L20 4" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 起点 -->
  <circle cx="4" cy="20" r="2.5" fill="#10b981"/>
  <!-- 中间节点 -->
  <circle cx="8" cy="16" r="2" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="2" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="16" cy="8" r="2" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <!-- 终点 -->
  <circle cx="20" cy="4" r="2.5" fill="#10b981"/>
</svg>
